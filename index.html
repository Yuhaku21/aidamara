<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damara AI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg, #eef2ff, #f8fafc); }
    .app { width: 100%; max-width: 850px; height: 100vh; margin: auto; display: flex; flex-direction: column; background: #fff; }
    .header { padding: 18px 25px; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; box-shadow: 0 4px 15px #0002; }
    .avatar-ai { width: 45px; height: 45px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 22px; }
    .header h1 { margin: 0; font-size: 22px; }
    .header span { font-size: 13px; opacity: .8; }
    .chat-box { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 18px; }
    .empty-state { margin: auto; color: #94a3b8; text-align: center; }
    .bubble-row { display: flex; animation: show .3s ease; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.assistant { justify-content: flex-start; }
    .bubble { max-width: 75%; padding: 14px 18px; border-radius: 20px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; box-shadow: 0 4px 12px #0001; }
    .bubble.user { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border-bottom-right-radius: 5px; }
    .bubble.assistant { background: #f8fafc; border: 1px solid #e2e8f0; color: #1e293b; border-bottom-left-radius: 5px; }
    .error-text { color: #dc2626; text-align: center; }
    .chat-form { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #e5e7eb; background: #fff; }
    input { flex: 1; padding: 14px 18px; border-radius: 30px; border: 1px solid #cbd5e1; outline: none; font-size: 15px; }
    input:focus { border-color: #2563eb; }
    button { padding: 0 25px; border: 0; border-radius: 30px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    @keyframes show { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { .bubble { max-width: 85%; } .header h1 { font-size: 18px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="avatar-ai">🤖</div>
      <div><h1>Damara AI</h1><span>Siap melayani 24 Jam</span></div>
    </header>
    <div id="chatBox" class="chat-box">
      <p id="emptyState" class="empty-state">Mulai percakapan dengan Damara AI</p>
    </div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" placeholder="Tulis pesan..." autocomplete="off">
      <button id="sendBtn" type="submit">Kirim</button>
    </form>
  </main>
  <script src="script.js?v=2"></script>
</body>
</html>
